<style>
:root{--bg1:#0b0816;--bg2:#1b1233;--panel:rgba(18,13,34,.82);--line:rgba(196,160,255,.22);--ink:#f1eafd;--mute:#b7a8d6;--acc:#a855f7;--acc2:#7c3aed;--tip:#f3c969}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 30% 20%,var(--bg2),var(--bg1) 70%)}
canvas{display:block;position:absolute;inset:0;touch-action:none}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#hint.off{display:none}
#hint{position:absolute;top:62px;left:12px;max-width:260px;padding:10px 12px;font-size:13px;color:var(--mute);pointer-events:none}
#menu{position:absolute;top:12px;right:12px;padding:10px 12px;font-size:13px;display:grid;gap:8px;z-index:5}
#menu label{display:flex;gap:6px;align-items:center;cursor:pointer}
select,button{font:inherit;font-size:13px;color:var(--ink);border-radius:8px;border:1px solid var(--line);background:#2a1d4d;padding:7px 12px;cursor:pointer}
button:hover{background:#3b2970}
button.main{background:var(--acc2);border-color:transparent}
button.main:hover{background:var(--acc)}

input[type=range]{accent-color:var(--acc);width:100%}
#bar{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:min(680px,calc(100% - 24px));padding:12px 14px;display:grid;gap:10px;z-index:5}
#bar .row{display:flex;gap:8px;align-items:center}

#info h3{margin:0 0 2px;font-size:18px}
#info .cat{font-size:12px;color:var(--mute);margin-bottom:8px}
#info p{margin:0 0 10px;font-size:14px;line-height:1.5}
#info .tip{border-left:3px solid var(--tip);padding-left:10px;color:#fbe9b5}

#info .tip b{display:block;font-size:12px;color:var(--tip);margin-bottom:2px}
#close{position:absolute;top:8px;right:8px;padding:2px 8px}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none}
.dl{display:flex;gap:6px}.dl button{flex:1;padding:7px 8px}
#back{position:absolute;top:12px;left:12px;padding:8px 12px;font-size:13px;color:var(--ink);text-decoration:none;z-index:5}
#back:hover{background:#3b2970}
#brand{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;letter-spacing:.04em;color:var(--mute);opacity:.75;text-decoration:none;white-space:nowrap;z-index:5}
#brand:hover{opacity:1;color:var(--ink)}
@media(max-width:700px){#hint{display:none}#menu{top:12px;left:96px;right:12px;display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 10px;font-size:12px}#menu select,#menu .dl{width:100%}#info{top:auto;bottom:150px;left:12px;right:12px;width:auto;transform:none;max-height:30%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<a id="back" class="glass" href="index.html" target="_top">← Inicio</a>
<div id="hint" class="glass">Tocá una estructura para ver qué es y qué significa al cantar. Arrastrá para rotar, pellizcá o usá la rueda para acercar.</div>

<div id="menu" class="glass">
  <select id="modelSelect" aria-label="Modelo">
    <option value="larynx_with_muscles_and_ligaments.glb">Con músculos y ligamentos</option>
    <option value="anatomy_of_the_larynx.glb">Anatomía general</option>
  </select>
  <label><input type="checkbox" data-cat="car" checked> Cartílagos</label>
  <label><input type="checkbox" data-cat="mus" checked> Músculos</label>
  <label><input type="checkbox" data-cat="lig" checked> Ligamentos</label>
  <label><input type="checkbox" id="tr"> PNG sin fondo</label>
  <div class="dl"><button id="dl0">⬇ PNG</button><button id="dl1">⬇ PNG + texto</button></div>
</div>

</div>

<div id="bar" class="glass">

    <div id="stepLabel">Laringe armada</div>
    <button id="next" class="main" aria-label="Paso siguiente">Separar siguiente ▶</button>
  </div>
  <div class="row">
    <input type="range" id="slider" min="0" max="100" value="0" aria-label="Nivel de despliegue">
    <button id="reset">Armar</button>
  </div>
</div>
<a id="brand" href="index.html" target="_top">Evelin Tardío · Estudio de Canto</a>
<div id="load">Cargando modelo…</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------- Datos anatómicos: [claves del modelo], nombre, descripción ---------- */
const D = [
 [["Thryoid_cartilage_Thyroid_Mat_0","Object_7"],"Cartílago Tiroides","El cartílago más grande de la laringe. Forma la pared frontal (la “nuez”) y protege las cuerdas vocales."],
 [["Cricoid_cartilage_Cricoid_0","Cricoid_Cartilage","Object_8"],"Cartílago Cricoides","Anillo completo en la base de la laringe. Sostiene a los aritenoides y es el punto de apoyo del tiroides."],
 [["Trachea_Vocal_Cords_Mat_0","Trachea","Object_11"],"Tráquea","Tubo que conduce el aire espiratorio hacia la laringe y hace posible el sonido."],
 [["Median_Cricothyroid_Ligament_Vocal_Cords_Mat_0","Object_9"],"Ligamento Cricotiroideo Medio","Membrana elástica que une el arco del cricoides con el borde inferior del tiroides."],
 [["Right_Corniculate_Cartilage_lambert8_0"],"Cartílago Corniculado (de Santorini)","Pequeño cartílago elástico sobre el aritenoides; da soporte a los pliegues aritenoepiglóticos."],
 [["Right_Thyroid_Ligament_Vocal_Cords_Mat_0","Right_Thyroid_Membrane_Vocal_Cords_Mat_0"],"Membrana Tirohioidea (Der.)","Estructura fibrosa lateral que conecta el hioides con el tiroides."],
 [["Left_Thyroid_Membrane_Vocal_Cords_Mat_0"],"Membrana Tirohioidea (Izq.)","Estructura fibrosa lateral que conecta el hioides con el tiroides."],
 [["Object_12"],"Membrana Tirohioidea","Conexión elástica que permite el movimiento vertical de la laringe."],
 [["Hyoid_Hyoid_Mat_0","Object_5"],"Hueso Hioides","Hueso “flotante” en la base de la lengua; ancla a los músculos que suben y bajan la laringe."],
 [["Epiglottis","Object_6"],"Epiglotis","Cartílago en forma de hoja que sella la vía aérea al tragar."],
 [["Object_3","Object_14","Object_18"],"Músculo Cricotiroideo","Tensor principal de las cuerdas: al contraerse las estira y alarga, elevando el tono."],
 [["Object_10","Object_20"],"Músculos Aritenoideos","Aproximan o separan los aritenoides para cerrar o abrir la glotis."]
];
const INFO = {}; D.forEach(([ks,n,d]) => ks.forEach(k => INFO[k] = {name:n, desc:d}));

/* Qué significa cada estructura para quien canta (se busca por nombre) */
const TIPS = [
 [/cricotiroideo$|^Músculo Cricotiroideo/i,"Es el músculo de los agudos. Si se fatiga, la nota alta se vuelve tensa o se quiebra: vale el calentamiento con sirenas suaves."],
 [/Aritenoide/i,"Dan el cierre de las cuerdas. Poco cierre se escucha como voz soplada; demasiado, como voz apretada."],
 [/Hioides/i,"La tensión de lengua y mandíbula llega hasta acá. Un hioides rígido empuja la laringe hacia arriba y aprieta la voz."],
 [/Tiroides/i,"Al subir de tono se inclina sobre el cricoides y estira las cuerdas. Una laringe estable y cómoda indica buena técnica."],
 [/Cricoides/i,"Es la base sobre la que giran los aritenoides y se inclina el tiroides. Sin esta articulación no hay cambios de tono."],
 [/Epiglotis/i,"Al bostezar-cantar se inclina hacia atrás y abre espacio en el tracto vocal, dando un timbre más redondo."],
 [/Tráquea/i,"Su tracción hacia abajo ayuda a mantener la laringe estable. Es el vínculo con el apoyo respiratorio."],
 [/Membrana|Ligamento/i,"Permiten que la laringe suba y baje con libertad. Una laringe “atrapada” es señal de tensión innecesaria."],
 [/Corniculado/i,"Acompaña a los aritenoides, que son los que abren y cierran las cuerdas."]
];

/* Categoría y orden de despliegue (de afuera hacia adentro) */
function classify(n){
  const s = n.toLowerCase(), has = (...w) => w.some(x => s.includes(x));
  if (has('membrana','membrane')) return {rank:1,cat:'lig'};
  if (has('músculo','muscle')) return {rank:4,cat:'mus'};
  if (has('ligamento','ligament')) return {rank:5,cat:'lig'};
  if (has('hioides','hyoid')) return {rank:0,cat:'car'};
  if (has('epiglot')) return {rank:3,cat:'car'};
  if (has('corniculad','corniculate')) return {rank:6,cat:'car'};
  if (has('cricoid')) return {rank:7,cat:'car'};
  if (has('tiroides','thyroid','thryoid')) return {rank:2,cat:'car'};
  if (has('tráquea','trachea')) return {rank:8,cat:'car'};
  return {rank:4,cat:'car'};
}
const RANK_LABEL = ["Hioides","Membrana tirohioidea","Cartílago tiroides","Epiglotis","Músculos","Ligamentos","Cartílago corniculado","Cartílago cricoides","Tráquea"];
const CAT_LABEL = {car:'Hueso / cartílago', mus:'Músculo', lig:'Ligamento / membrana'};

/* Dirección de separación por rank (sx = lado izquierdo/derecho) */
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const DIRS = [
  ()=>V(0,1.5,.2), sx=>V(sx*1.1,.8,0), ()=>V(0,.3,.6), ()=>V(0,.8,-.4),
  sx=>V(sx*1.2,-.2,-.3), sx=>V(sx*.9,-.3,.4), sx=>V(sx*.6,1.2,-.4), ()=>V(0,-.6,-.6), ()=>V(0,-1.3,0)
];

/* ---------- Escena ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const key = new THREE.DirectionalLight(0xfff1e0, 2); key.position.set(5,10,7); scene.add(key);
const fill = new THREE.DirectionalLight(0xb9a0ff, 1); fill.position.set(-6,2,-8); scene.add(fill);

const $ = id => document.getElementById(id);
const DEBUG = location.search.includes('debug');
const marked = new Set();
let model = null, pieces = [], groups = [], step = 0, stepMode = false, selected = null, hovered = null;
let maxDim = 1, focus = new THREE.Vector3();
const layerOn = {car:true, mus:true, lig:true};

/* ===== PALETA DE COLORES: editá los hex a gusto ===== */
const RECOLOR = ['anatomy_of_the_larynx.glb'];   // modelos que usan esta paleta
const PALETA = {
  0:'#e9dfc9',   // Hioides (hueso, marfil)
  1:'#cfc3f2',   // Membrana tirohioidea
  2:'#a78bfa',   // Cartílago tiroides
  3:'#e6b3f0',   // Epiglotis
  4:'#c0496f',   // Músculos
  5:'#ddd0f7',   // Ligamentos
  6:'#f3c969',   // Cartílago corniculado (dorado)
  7:'#7c3aed',   // Cartílago cricoides
  8:'#d9d2ea',   // Tráquea
  otro:'#d6cfe6' // Piezas sin identificar
};
const PALETA_POR_NOMBRE = {};   // opcional, por pieza: 'Nombre_Interno': '#rrggbb'
function recolor(mat, cl, raw){
  const hex = PALETA_POR_NOMBRE[raw] || PALETA[(cl.rank === 4 && cl.cat === 'car') ? 'otro' : cl.rank];
  if (!hex) return;
  mat.map = null; mat.vertexColors = false; mat.color.set(hex);
  if ('roughness' in mat){ mat.roughness = .55; mat.metalness = .05; }
  mat.needsUpdate = true;
}

/* ---------- Modo ?debug: lista de piezas marcadas ---------- */
function renderMarks(){
  let b = $('mk');
  if (!b){
    b = document.createElement('div'); b.id = 'mk';
    b.style.cssText = 'position:absolute;right:8px;bottom:150px;width:230px;max-height:40%;overflow:auto;padding:8px;font-size:11px;background:#000c;color:#fb923c;z-index:9';
    b.innerHTML = '<button id="cp" style="margin-bottom:6px">Copiar lista</button><pre id="mkt" style="margin:0;white-space:pre-wrap;user-select:text"></pre>';
    document.body.append(b);
    $('cp').onclick = () => navigator.clipboard.writeText([...marked].join('\n')).catch(() => {});
  }
  $('mkt').textContent = marked.size ? [...marked].join('\n') : 'Tocá las piezas que quedan pegadas';
}

/* ---------- Islas: separa cada pieza en partes desconectadas ---------- */
const FILAMENTOS = 'ocultar';      // 'ocultar' o 'mantener': qué hacer con los filamentos al desplegar
const FILAMENTO_FRACCION = 0.05;   // una isla con menos de este % de los triángulos de su pieza se considera filamento
function splitIslands(root){
  const list = [];
  root.traverse(o => { if (o.isMesh && !o.isSkinnedMesh && !Array.isArray(o.material) && o.geometry.attributes.position) list.push(o); });
  const comp = ['getX','getY','getZ','getW'];
  for (const m of list){
    const g = m.geometry, pos = g.attributes.position, n = pos.count;
    const ix = g.index ? g.index.array : null, nt = Math.floor((ix ? ix.length : n) / 3);
    if (nt < 2) continue;
    g.computeBoundingBox();
    const step = Math.max(g.boundingBox.getSize(new THREE.Vector3()).length() * 1e-5, 1e-9);
    const ids = new Map(), weld = new Int32Array(n);
    for (let i = 0; i < n; i++){
      const k = Math.round(pos.getX(i)/step) + ',' + Math.round(pos.getY(i)/step) + ',' + Math.round(pos.getZ(i)/step);
      let w = ids.get(k); if (w === undefined){ w = ids.size; ids.set(k, w); } weld[i] = w;
    }
    const par = new Int32Array(ids.size).map((_, i) => i);
    const find = a => { while (par[a] !== a){ par[a] = par[par[a]]; a = par[a]; } return a; };
    const v = (t, c) => ix ? ix[t*3 + c] : t*3 + c;
    for (let t = 0; t < nt; t++){
      const ra = find(weld[v(t,0)]);
      par[find(weld[v(t,1)])] = ra;
      par[find(weld[v(t,2)])] = ra;
    }
    const groups = new Map();
    for (let t = 0; t < nt; t++){ const r = find(weld[v(t,0)]); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(t); }
    if (groups.size < 2) continue;
    for (const tris of groups.values()){
      const remap = new Map(), order = [], newIdx = [];
      for (const t of tris) for (let c = 0; c < 3; c++){
        const o = v(t,c); let q = remap.get(o);
        if (q === undefined){ q = order.length; remap.set(o, q); order.push(o); }
        newIdx.push(q);
      }
      const ng = new THREE.BufferGeometry();
      for (const [name, att] of Object.entries(g.attributes)){
        const sz = att.itemSize, arr = new Float32Array(order.length * sz);
        order.forEach((o, i) => { for (let k = 0; k < sz; k++) arr[i*sz + k] = att[comp[k]](o); });
        ng.setAttribute(name, new THREE.BufferAttribute(arr, sz));
      }
      ng.setIndex(newIdx);
      const nm = new THREE.Mesh(ng, m.material);
      nm.name = m.name; nm.position.copy(m.position); nm.quaternion.copy(m.quaternion); nm.scale.copy(m.scale);
      nm.userData.tris = tris.length; nm.userData.parentTris = nt;
      m.parent.add(nm);
    }
    m.parent.remove(m);
  }
}

/* ---------- Carga ---------- */
const loader = new GLTFLoader();
function loadModel(file){
  $('load').textContent = 'Cargando modelo…'; $('load').style.display = 'grid';
  if (model){ scene.remove(model); model = null; }
  pieces = []; marked.clear(); select(null); hovered = null;
  loader.load(file, gltf => {
    model = gltf.scene; splitIslands(model);
    let box = new THREE.Box3().setFromObject(model);
    const c = box.getCenter(new THREE.Vector3());
    model.position.sub(c);
    scene.add(model); model.updateMatrixWorld(true);
    box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    maxDim = Math.max(size.x,size.y,size.z);
    camera.near = maxDim*.08; camera.far = maxDim*30; controls.minDistance = maxDim*.4; camera.updateProjectionMatrix();
    camera.position.set(0, maxDim*.3, maxDim*2.6);
    focus.set(0,0,0); controls.target.copy(focus);

    model.traverse(m => {
      if (!m.isMesh) return;
      m.material = m.material.clone(); m.material.transparent = false; m.material.polygonOffset = true; m.material.polygonOffsetFactor = (pieces.length % 24) * .5; m.material.polygonOffsetUnits = (pieces.length % 24) * 2;
      const data = INFO[m.name];
      const name = data ? data.name : (m.name || 'Estructura laríngea');
      const cl = classify(name);
      if (RECOLOR.includes(file)) recolor(m.material, cl, m.name);
      const wc = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3());
      const sx = Math.abs(wc.x) > maxDim*.03 ? Math.sign(wc.x) : 0;
      let dir = DIRS[cl.rank](sx);
      if (sx===0 && cl.rank===4) dir = V(0,0,-1);
      const worldOff = dir.multiplyScalar(maxDim*.55);
      const p0 = m.parent.worldToLocal(wc.clone());
      const p1 = m.parent.worldToLocal(wc.clone().add(worldOff));
      pieces.push({mesh:m, name, desc: data ? data.desc : 'Componente anatómico de la laringe involucrado en la fonación o en el soporte estructural.',
        rank:cl.rank, cat:cl.cat, tris:m.userData.tris, filament: FILAMENTOS === 'ocultar' && !!m.userData.parentTris && m.userData.tris / m.userData.parentTris < FILAMENTO_FRACCION, base:m.position.clone(), delta:p1.sub(p0), cur:0, target:0});
    });
    groups = [...new Set(pieces.map(p => p.rank))].sort((a,b)=>a-b);
    if (DEBUG){ let d = $('dbg'); if (!d){ d = document.createElement('pre'); d.id = 'dbg'; d.style.cssText = 'position:absolute;left:8px;bottom:150px;max-height:40%;overflow:auto;margin:0;padding:8px;font-size:11px;background:#000c;color:#9f9;z-index:9;user-select:text'; document.body.append(d); } d.textContent = pieces.map(p => `${p.mesh.name} | ${p.name} | rango ${p.rank} ${p.cat} | ${p.tris || '-'} tri${p.filament ? ' | FILAMENTO' : ''}`).join('\n'); }
    if (DEBUG) renderMarks();
    setSlider(0); $('load').style.display = 'none';
  }, undefined, err => { console.error(err); $('load').textContent = 'No se pudo cargar el modelo. Revisá que el archivo .glb esté junto a este HTML.'; });
}
$('modelSelect').addEventListener('change', e => loadModel(e.target.value));

/* ---------- Despliegue ---------- */
function setSlider(v){            // modo libre: todas las piezas a la vez
  stepMode = false; step = 0;
  pieces.forEach(p => p.target = v);
  $('slider').value = v*100;
  $('stepLabel').textContent = v===0 ? 'Laringe armada' : `Despliegue ${Math.round(v*100)}%`;
}
function goStep(k){               // modo pasos: una estructura nueva por vez
  step = Math.max(0, Math.min(groups.length, k)); stepMode = true;
  pieces.forEach(p => p.target = groups.indexOf(p.rank) < step ? 1 : 0);
  $('slider').value = step/groups.length*100;
  $('stepLabel').textContent = step===0 ? 'Laringe armada' : `Paso ${step}/${groups.length}: ${RANK_LABEL[groups[step-1]]}`;
}
$('slider').addEventListener('input', e => setSlider(e.target.value/100));
$('next').addEventListener('click', () => goStep(stepMode ? step+1 : 1));
$('prev').addEventListener('click', () => goStep(stepMode ? step-1 : 0));
$('reset').addEventListener('click', () => { setSlider(0); select(null); });

/* ---------- Capas ---------- */
document.querySelectorAll('[data-cat]').forEach(cb => cb.addEventListener('change', () => { layerOn[cb.dataset.cat] = cb.checked; if (selected && !layerOn[selected.cat]) select(null); }));

/* ---------- Selección y panel ---------- */
function select(p){
  selected = p; $('hint').classList.toggle('off', !!p);
  if (DEBUG && p){ marked.has(p.mesh.name) ? marked.delete(p.mesh.name) : marked.add(p.mesh.name); renderMarks(); }
  if (!p){ $('info').style.display='none'; focus.set(0,0,0); return; }
  $('iName').textContent = p.name; $('iCat').textContent = CAT_LABEL[p.cat] + (DEBUG ? ' · ' + p.mesh.name : ''); $('iDesc').textContent = p.desc;
  const t = TIPS.find(([re]) => re.test(p.name));
  $('iTip').style.display = t ? 'block' : 'none'; if (t) $('iTipTxt').textContent = t[1];
  $('info').style.display = 'block';
  if (!DEBUG) new THREE.Box3().setFromObject(p.mesh).getCenter(focus);
}
$('close').addEventListener('click', () => select(null));

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  const vis = pieces.filter(p => p.mesh.visible).map(p => p.mesh);
  const hit = ray.intersectObjects(vis, false)[0];
  return hit ? pieces.find(p => p.mesh === hit.object) : null;
}
renderer.domElement.addEventListener('pointerdown', e => down = {x:e.clientX, y:e.clientY});
renderer.domElement.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX-down.x, e.clientY-down.y) < 5) select(pick(e));
  down = null;
});
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType==='mouse'){ hovered = pick(e); renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab'; } });

addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---------- Descargar PNG (alta calidad) ---------- */
let job = null;
const FONT = '"Segoe UI", system-ui, -apple-system, sans-serif';
const slug = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const wrapText = (c, text, maxW) => {
  const out = []; let line = '';
  for (const w of text.split(' ')){
    const t = line ? line + ' ' + w : w;
    if (c.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
};
const firstSentence = d => { const t = d.split('. ')[0]; return t.endsWith('.') ? t : t + '.'; };

function runExport({text, transparent}){
  const cv = renderer.domElement, cw0 = cv.clientWidth, ch0 = cv.clientHeight;
  const k = Math.min(4, 3000 / Math.max(cw0, ch0)), W = Math.round(cw0 * k), H = Math.round(ch0 * k);
  /* encuadre automático sobre lo que está visible */
  camera.updateMatrixWorld();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const bx = new THREE.Box3(), vv = new THREE.Vector3();
  for (const p of pieces){
    if (!p.mesh.visible) continue;
    bx.setFromObject(p.mesh); if (bx.isEmpty()) continue;
    for (let i = 0; i < 8; i++){
      vv.set(i & 1 ? bx.max.x : bx.min.x, i & 2 ? bx.max.y : bx.min.y, i & 4 ? bx.max.z : bx.min.z).project(camera);
      x0 = Math.min(x0, vv.x); x1 = Math.max(x1, vv.x); y0 = Math.min(y0, vv.y); y1 = Math.max(y1, vv.y);
    }
  }
  if (x0 > x1) return;
  const px = x => (x * .5 + .5) * W, py = y => (1 - (y * .5 + .5)) * H;
  const m0 = .08 * Math.max(px(x1) - px(x0), py(y0) - py(y1));
  const sx = Math.max(0, Math.floor(px(x0) - m0)), sy = Math.max(0, Math.floor(py(y1) - m0));
  const ex = Math.min(W, Math.ceil(px(x1) + m0)), ey = Math.min(H, Math.ceil(py(y0) + m0));
  const cw = ex - sx, ch = ey - sy;
  if (cw < 2 || ch < 2) return;

  /* render en alta resolución, sin resaltados */
  const pr = renderer.getPixelRatio();
  const em = pieces.map(p => p.mesh.material.emissive ? p.mesh.material.emissive.getHex() : 0);
  pieces.forEach(p => p.mesh.material.emissive && p.mesh.material.emissive.setHex(0));
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.render(scene, camera);
  const shot = document.createElement('canvas'); shot.width = cw; shot.height = ch;
  shot.getContext('2d').drawImage(cv, sx, sy, cw, ch, 0, 0, cw, ch);
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight);
  pieces.forEach((p, i) => p.mesh.material.emissive && p.mesh.material.emissive.setHex(em[i]));

  const bg = c => { const g = c.createLinearGradient(0, 0, c.canvas.width, c.canvas.height); g.addColorStop(0, '#1b1233'); g.addColorStop(1, '#0b0816'); c.fillStyle = g; c.fillRect(0, 0, c.canvas.width, c.canvas.height); };
  const name = selected ? selected.name : 'completa';
  let out;
  if (!text){
    out = document.createElement('canvas'); out.width = cw; out.height = ch;
    const c = out.getContext('2d'); if (!transparent) bg(c);
    c.drawImage(shot, 0, 0);
  } else {
    const u = Math.max(ch, 1400) / 1000, pw = Math.round(680 * u), pad = 56 * u, tw = pw - 2 * pad;
    const seen = new Map(); pieces.forEach(p => { if (p.mesh.visible && !seen.has(p.name)) seen.set(p.name, p); });
    const paint = (c, X, draw) => {
      let y = pad + 40 * u;
      const put = (t, size, wt, col, gap) => {
        c.font = `${wt} ${size * u}px ${FONT}`; c.fillStyle = col;
        for (const ln of wrapText(c, t, tw)){ if (draw) c.fillText(ln, X + pad, y); y += size * u * 1.35; }
        y += gap * u;
      };
      if (selected){
        put(selected.name, 46, 700, '#f1eafd', 6); put(CAT_LABEL[selected.cat], 24, 400, '#b7a8d6', 28);
        put(selected.desc, 30, 400, '#f1eafd', 30);
        const t = TIPS.find(([re]) => re.test(selected.name));
        if (t){ put('PARA EL CANTANTE', 22, 700, '#f3c969', 6); put(t[1], 28, 400, '#fbe9b5', 20); }
      } else {
        put('Laringe', 46, 700, '#f1eafd', 6); put('Estructuras visibles', 24, 400, '#b7a8d6', 28);
        [...seen.values()].sort((a, b) => a.rank - b.rank).forEach(p => { put(p.name, 28, 700, '#c4a0ff', 2); put(firstSentence(p.desc), 24, 400, '#e6dcf8', 22); });
      }
      return y;
    };
    const need = paint(document.createElement('canvas').getContext('2d'), 0, false);
    const Ht = Math.max(ch, Math.ceil(need + 100 * u));
    out = document.createElement('canvas'); out.width = cw + pw; out.height = Ht;
    const c = out.getContext('2d'); bg(c);
    c.drawImage(shot, 0, Math.round((Ht - ch) / 2));
    c.fillStyle = 'rgba(196,160,255,.25)'; c.fillRect(cw, 0, 2 * u, Ht);
    paint(c, cw, true);
    c.font = `500 ${22 * u}px ${FONT}`; c.fillStyle = '#b7a8d6'; c.fillText('Evelin Tardío · Estudio de Canto', cw + pad, Ht - pad * .7);
  }
  out.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'laringe-' + slug(name) + (text ? '-con-texto' : '') + '.png';
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
}
$('dl0').addEventListener('click', () => { hovered = null; job = {text: false, transparent: $('tr').checked}; });
$('dl1').addEventListener('click', () => { hovered = null; job = {text: true}; });

/* ---------- Bucle ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function animate(){
  requestAnimationFrame(animate);
  controls.target.lerp(focus, .08);
  controls.update();
  const lastRank = stepMode && step>0 ? groups[step-1] : -1;
  const anyExp = pieces.some(q => q.cur > .03);
  for (const p of pieces){
    p.cur += (p.target - p.cur) * (reduce ? 1 : .1);
    p.mesh.position.copy(p.base).addScaledVector(p.delta, p.cur);
    p.mesh.visible = layerOn[p.cat] && !(p.filament && anyExp && !DEBUG);
    const m = p.mesh.material;
    const wantOp = selected && selected !== p && !DEBUG ? .12 : 1;
    m.opacity += (wantOp - m.opacity) * .2;
    m.transparent = m.opacity < .99; m.depthWrite = !m.transparent;
    if (m.emissive) m.emissive.setHex(DEBUG && marked.has(p.mesh.name) ? 0xff5500 : DEBUG && p.filament ? 0x007a8a : p === selected ? 0x5b21b6 : p === hovered ? 0x2e1065 : p.rank === lastRank ? 0x24104a : 0x000000);
  }
  if (job){ const j = job; job = null; try { runExport(j); } catch (e) { console.error(e); } }
  renderer.render(scene, camera);
}
animate();
loadModel($('modelSelect').value);
</script>
